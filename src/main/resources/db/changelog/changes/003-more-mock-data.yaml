databaseChangeLog:
  - changeSet:
      id: 3
      author: kov
      changes:
        # Добавляем 30 клиентов
        - loadData:
            file: db/changelog/data/clients.csv
            tableName: clients
            separator: ','
            usePreparedStatements: true
            columns:
              - column:
                  name: name
                  type: STRING
              - column:
                  name: email
                  type: STRING

        # Добавляем 40 счетов
        - loadData:
            file: db/changelog/data/accounts.csv
            tableName: accounts
            separator: ','
            usePreparedStatements: true
            columns:
              - column:
                  name: client_id
                  type: NUMERIC
              - column:
                  name: balance
                  type: NUMERIC
              - column:
                  name: type
                  type: STRING

        # Добавляем 20 транзакций
        - loadData:
            file: db/changelog/data/transactions.csv
            tableName: transactions
            separator: ','
            usePreparedStatements: true
            columns:
              - column:
                  name: account_id
                  type: NUMERIC
              - column:
                  name: amount
                  type: NUMERIC
              - column:
                  name: transaction_date
                  type: DATETIME

        # Добавляем 10 записей логов ошибок
        - loadData:
            file: db/changelog/data/error_logs.csv
            tableName: data_source_error_logs
            separator: ','
            usePreparedStatements: true
            columns:
              - column:
                  name: error_message
                  type: STRING
              - column:
                  name: error_date
                  type: DATETIME
              - column:
                  name: source
                  type: STRING 